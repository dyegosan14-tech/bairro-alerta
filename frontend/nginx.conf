server {
    listen 80;

    # Cabeçalhos de segurança básicos — a configuração anterior não definia nenhum,
    # deixando a SPA suscetível a clickjacking e sem nenhuma política de conteúdo.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src inclui http://localhost:3001 porque o build atual do frontend usa
    # VITE_API_URL=http://localhost:3001/api/v1 (chamada direta do navegador à API,
    # via a porta publicada no host) em vez do proxy /api/ abaixo — ver observação no
    # relatório de auditoria sobre essa divergência de topologia.
    add_header Content-Security-Policy "default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://localhost:3001; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }
}
