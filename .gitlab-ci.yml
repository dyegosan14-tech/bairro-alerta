# ==============================================================================
# GitLab CI/CD Pipeline - Voz do Bairro
# ==============================================================================
image: node:20-alpine

stages:
  - lint
  - typecheck
  - test
  - build
  - containerize

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NODE_ENV: test

# Este é um monorepo com npm workspaces: existe UM único package-lock.json na raiz
# (backend/ e frontend/ não têm lockfile próprio). Por isso `npm ci` roda sempre a
# partir da raiz do projeto (onde o lockfile existe) e os scripts de cada workspace são
# disparados com `--workspace=`, em vez de `cd backend && npm ci` / `cd frontend && npm ci`
# (que falhariam por não haver lockfile ali).
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/
    - backend/node_modules/
    - frontend/node_modules/

# ------------------------------------------------------------------------------
# 0. Stage: Lint (ESLint de verdade agora existe nos dois workspaces — antes era
#    "npm run lint || true", que mascarava qualquer falha e, no backend, nem tinha
#    script "lint" definido).
# ------------------------------------------------------------------------------
lint:backend:
  stage: lint
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint --workspace=backend

lint:frontend:
  stage: lint
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint --workspace=frontend

# ------------------------------------------------------------------------------
# 1. Stage: Typecheck
# ------------------------------------------------------------------------------
typecheck:backend:
  stage: typecheck
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck --workspace=backend

typecheck:frontend:
  stage: typecheck
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck --workspace=frontend

# ------------------------------------------------------------------------------
# 2. Stage: Automated Unit & Integration Tests
# ------------------------------------------------------------------------------
test:backend:
  stage: test
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  variables:
    POSTGRES_USER: voz_user
    POSTGRES_PASSWORD: voz_secret_password
    POSTGRES_DB: voz_do_bairro_test
    DATABASE_URL: postgresql://voz_user:voz_secret_password@postgres:5432/voz_do_bairro_test
    JWT_SECRET: ci_test_secret_jwt_key_1234567890
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run migrate --workspace=backend
    - npm run test --workspace=backend

test:frontend:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test --workspace=frontend

# ------------------------------------------------------------------------------
# 3. Stage: Build Artifacts
# ------------------------------------------------------------------------------
build:backend:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build --workspace=backend
  artifacts:
    expire_in: 1 week
    paths:
      - backend/dist/

build:frontend:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build --workspace=frontend
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/dist/

# ------------------------------------------------------------------------------
# 4. Stage: Docker Container Build & Registry Push (main branch)
# ------------------------------------------------------------------------------
docker:build:
  stage: containerize
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  only:
    - main
    - master
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA ./backend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
