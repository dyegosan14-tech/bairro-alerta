name: CI/CD Pipeline - Voz do Bairro

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: voz_user
          POSTGRES_PASSWORD: voz_secret_password
          POSTGRES_DB: voz_do_bairro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Monorepo com npm workspaces: existe um único package-lock.json na raiz
          # (backend/ e frontend/ não têm lockfile próprio) — por isso `npm ci` roda
          # sempre a partir da raiz do projeto, nunca de dentro de cada workspace.
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=backend

      - name: Typecheck
        run: npm run typecheck --workspace=backend

      - name: Run migrations (schema para os testes de integração PostGIS)
        env:
          DATABASE_URL: postgresql://voz_user:voz_secret_password@localhost:5432/voz_do_bairro_test
          JWT_SECRET: ci_test_secret_jwt_key_1234567890
          NODE_ENV: test
        run: npm run migrate --workspace=backend

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://voz_user:voz_secret_password@localhost:5432/voz_do_bairro_test
          JWT_SECRET: ci_test_secret_jwt_key_1234567890
          NODE_ENV: test
        run: npm run test --workspace=backend

      - name: Build Backend
        run: npm run build --workspace=backend

  frontend-build:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Typecheck
        run: npm run typecheck --workspace=frontend

      - name: Run Tests
        run: npm run test --workspace=frontend

      - name: Build Frontend
        run: npm run build --workspace=frontend
