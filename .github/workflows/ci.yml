name: CI/CD Pipeline - Voz do Bairro

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: voz_user
          POSTGRES_PASSWORD: voz_secret_password
          POSTGRES_DB: voz_do_bairro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://voz_user:voz_secret_password@localhost:5432/voz_do_bairro_test
          JWT_SECRET: ci_test_secret_jwt_key_1234567890
          NODE_ENV: test
        run: cd backend && npm test

      - name: Build Backend
        run: cd backend && npm run build

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build
